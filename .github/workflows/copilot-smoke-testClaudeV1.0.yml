# Copilot smoke test — Phase 0, step 4 (A1 CI/CD demo, Copilot version)
# Purpose: prove that Copilot CLI runs inside GitHub Actions with the
# COPILOT_GITHUB_TOKEN secret, before anything else is built.
# Save as: .github/workflows/copilot-smoke-test.yml   (push from Command Prompt)
# Run: Actions tab -> "Copilot smoke test" -> Run workflow
# Safe to delete after the test.

name: Copilot smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Show Copilot CLI version
        run: copilot --version

      - name: Ask Copilot one question (no tools allowed)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "Reply with exactly one word: OK" -s --no-ask-user | tee copilot-output.txt
          echo "### Copilot reply" >> "$GITHUB_STEP_SUMMARY"
          cat copilot-output.txt >> "$GITHUB_STEP_SUMMARY"
