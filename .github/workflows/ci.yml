# Pipeline 2 of 2: continuous integration.
# Runs on every pull request (including the agent's) and on main.
# Starts the BankPolicy web chat, runs the Playwright tests, keeps the HTML report,
# and posts the result on the Jira story when the pull request came from an agent
# (branch agent/<KEY> from the OpenAI version, agent-copilot/<KEY> from the Copilot version).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run the tests against the BankPolicy web chat
        run: npx playwright test --pass-with-no-tests

      - name: Keep the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Post the result on the Jira story
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent')
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_MODE: ${{ vars.JIRA_MODE || 'live' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/report-to-jira.mjs "${HEAD_REF##*/}"   # agent/BP-2 or agent-copilot/BP-2 -> BP-2
